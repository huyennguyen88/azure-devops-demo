name: Spring Boot CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: |
          chmod +x ./gradlew
          ./gradlew clean build --no-daemon
      - name: Prepare Docker artifact
        run: |
          mkdir -p build/libs
          JAR=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-plain.jar' | head -n 1)
          test -n "$JAR"
          cp "$JAR" build/libs/app.jar
      - name: Build Docker image
        run: docker build --build-arg GIT_COMMIT="$GITHUB_SHA" -t azure-devops-demo:ci .
      - name: Start container
        run: docker run -d --rm --name demo -p 8080:8080 azure-devops-demo:ci
      - name: Smoke test
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 5 http://localhost:8080/hello; then
              echo "Smoke test passed"
              exit 0
            fi
            sleep 2
          done
          docker logs demo
          exit 1
      - name: Show container logs
        if: always()
        run: docker logs demo 2>&1 || true
      - name: Stop container
        if: always()
        run: docker stop demo || true
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/
          if-no-files-found: ignore
