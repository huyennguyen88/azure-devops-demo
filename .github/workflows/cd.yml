
name: Deploy Spring Boot to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-production
  cancel-in-progress: false

env:
  RESOURCE_GROUP: rg-azure-devops-demo
  WEBAPP_NAME: app-devops-demo-2026h
  ACR_NAME: acrdevopsdemo2026h
  IMAGE_NAME: azure-devops-demo

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build and test
        run: ./gradlew clean build --no-daemon

      - name: Azure login using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name "$ACR_NAME"

      - name: Build and push Docker image
        run: |
          IMAGE="$ACR_NAME.azurecr.io/$IMAGE_NAME:${GITHUB_SHA}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy to Azure Web App
        run: |
          IMAGE="$ACR_NAME.azurecr.io/$IMAGE_NAME:${GITHUB_SHA}"

          az webapp config container set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$WEBAPP_NAME" \
            --container-image-name "$IMAGE"

          az webapp restart \
            --resource-group "$RESOURCE_GROUP" \
            --name "$WEBAPP_NAME"

      - name: Smoke test
        run: |
          URL="https://$WEBAPP_NAME.azurewebsites.net/hello"

          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error \
              --max-time 10 "$URL"; then
              echo "Smoke test passed"
              exit 0
            fi

            echo "Waiting for application: $attempt/20"
            sleep 15
          done

          echo "Smoke test failed"
          exit 1
