name: Deploy Spring Boot to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-staging
  cancel-in-progress: false

env:
  RESOURCE_GROUP: rg-azure-devops-demo
  WEBAPP_NAME: app-devops-demo-2026h
  ACR_NAME: acrdevopsdemo2026h
  IMAGE_NAME: azure-devops-demo

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: |
          chmod +x ./gradlew
          ./gradlew clean build --no-daemon
      - name: Prepare Docker artifact
        run: |
          JAR=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-plain.jar' | head -n 1)
          test -n "$JAR"
          cp "$JAR" build/libs/app.jar
      - name: Build Docker image
        run: |
          IMAGE="$ACR_NAME.azurecr.io/$IMAGE_NAME:$GITHUB_SHA"
          docker build --build-arg GIT_COMMIT="$GITHUB_SHA" -t "$IMAGE" .
      - name: Azure login using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Push image to ACR
        run: |
          az acr login --name "$ACR_NAME"
          docker push "$ACR_NAME.azurecr.io/$IMAGE_NAME:$GITHUB_SHA"
      - name: Deploy to Staging
        run: |
          IMAGE="$ACR_NAME.azurecr.io/$IMAGE_NAME:$GITHUB_SHA"
          az webapp config container set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$WEBAPP_NAME" \
            --slot staging \
            --container-image-name "$IMAGE"
          az webapp restart \
            --resource-group "$RESOURCE_GROUP" \
            --name "$WEBAPP_NAME" \
            --slot staging
      - name: Verify deployed version
        run: |
          URL="https://$WEBAPP_NAME-staging.azurewebsites.net/version"
          for attempt in $(seq 1 30); do
            RESPONSE=$(curl --fail --silent --max-time 10 "$URL" || true)
            ACTUAL=$(printf '%s' "$RESPONSE" | jq -r '.version // empty' 2>/dev/null || true)
            if [ "$ACTUAL" = "$GITHUB_SHA" ]; then
              echo "Verified Staging commit: $ACTUAL"
              exit 0
            fi
            echo "Waiting for correct image ($attempt/30); observed: ${ACTUAL:-unavailable}"
            sleep 15
          done
          echo "Staging version verification failed"
          exit 1
